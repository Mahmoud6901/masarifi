name: checks

# The pull-request check that main's protection requires. The iOS build stays in ios-ipa.yml, on tags.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Same pinned version as ios-ipa.yml: Flutter 3.50 deprecates material.dart.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Run portable Edge tests
        run: node --experimental-strip-types supabase/functions/ci/run-tests.ts

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks lists the pull request's commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
