name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same version as the iOS release build.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Run portable Edge tests
        run: node --experimental-strip-types supabase/functions/ci/run-tests.ts

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
